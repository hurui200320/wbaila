name: Release

# Publishes to PyPI via Trusted Publisher (OIDC; no stored secrets).
# Triggered only by v* tags, which only maintainers can push; pull
# requests can never reach this workflow. The publish job only
# downloads artifacts and calls pypa/gh-action-pypi-publish, per
# PyPI's security recommendations.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

defaults:
  run:
    working-directory: cli

jobs:
  build:
    name: Check and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Verify tag matches cli/pyproject.toml version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          pkg_version="$(uv version --short)"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package version $pkg_version; bump cli/pyproject.toml before tagging"
            exit 1
          fi

      - run: uv sync --locked
      - run: uvx ruff check .
      - run: uvx ruff format --check .
      - run: uvx pyright
      - run: uv run python -m unittest discover -s tests
      - run: uv build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: cli/dist/
          if-no-files-found: error

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write # required for PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

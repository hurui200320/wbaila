[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wbaila"
version = "0.2.0"
description = "WBAILA — What Bird Am I Looking At? A WAILA-style bird and wildlife ID CLI."
readme = "README.md"
requires-python = ">=3.13"
license = "AGPL-3.0-only"
authors = [{ name = "hurui200320" }]
keywords = [
  "bird",
  "birding",
  "bird-identification",
  "ornithology",
  "wildlife",
  "bioacoustics",
  "dongniao",
  "cli",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering",
  "Topic :: Utilities",
]
dependencies = ["pillow>=11"]

[dependency-groups]
# Dev-only: pillow's type annotations reference NumpyArray (defined
# under TYPE_CHECKING in PIL._typing), so pyright needs numpy to be
# importable in the analysis environment. Not needed at runtime.
dev = ["numpy>=2"]

[project.urls]
Homepage = "https://github.com/hurui200320/wbaila"
Repository = "https://github.com/hurui200320/wbaila"
Issues = "https://github.com/hurui200320/wbaila/issues"

[project.scripts]
wbaila = "wbaila.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/wbaila"]
